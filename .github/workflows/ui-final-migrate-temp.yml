name: Temporary Final UI Migration

on:
  push:
    branches:
      - fix/android-typography-fx-foundation

permissions:
  contents: write

concurrency:
  group: slowlight-final-ui-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-typography-fx-foundation
          fetch-depth: 0

      - name: Migrate remaining Material visual entry points
        shell: python
        run: |
          from pathlib import Path
          import os
          import re

          root = Path('client/lib')
          modified = []

          typed_replacements = [
              (re.compile(r'\bshowModalBottomSheet(?P<t><[^>]+>)?\s*\('), 'FxSheet.show'),
              (re.compile(r'\bPopupMenuButton(?P<t><[^>]+>)?\s*\('), 'FxMenu'),
              (re.compile(r'\bPopupMenuItem(?P<t><[^>]+>)?\s*\('), 'FxMenuItem'),
              (re.compile(r'\bshowDialog(?P<t><[^>]+>)?\s*\('), 'FxDialog.raw'),
          ]
          plain_replacements = [
              (re.compile(r'\bExpansionTile\s*\('), 'FxExpansionTile('),
              (re.compile(r'\bAlertDialog\s*\('), 'FxAlertDialog('),
              (re.compile(r'(?<!Fx)\bDialog\s*\('), 'FxDialogSurface('),
              (re.compile(r'(?<!Fx)\bListTile\s*\('), 'FxListTile('),
              (re.compile(r'\bshowTimePicker\s*\('), 'showFxTimePicker('),
              (re.compile(r'\bshowDatePicker\s*\('), 'showFxDatePicker('),
          ]

          def ensure_fx_import(path: Path, source: str) -> str:
              if 'ui/fx.dart' in source:
                  return source
              if source.lstrip().startswith('part of '):
                  return source
              rel = os.path.relpath(root / 'ui' / 'fx.dart', path.parent).replace('\\', '/')
              import_line = f"import '{rel}';"
              lines = source.splitlines()
              import_indexes = [i for i, line in enumerate(lines) if line.startswith('import ')]
              if import_indexes:
                  lines.insert(import_indexes[-1] + 1, import_line)
              else:
                  lines.insert(0, import_line)
              return '\n'.join(lines) + ('\n' if source.endswith('\n') else '')

          for path in sorted(root.rglob('*.dart')):
              normalized = path.as_posix()
              if normalized.startswith('client/lib/ui/widgets/'):
                  continue
              source = path.read_text(encoding='utf-8')
              updated = source
              for pattern, replacement in typed_replacements:
                  updated = pattern.sub(
                      lambda match, replacement=replacement:
                          f"{replacement}{match.group('t') or ''}(",
                      updated,
                  )
              for pattern, replacement in plain_replacements:
                  updated = pattern.sub(replacement, updated)
              if updated != source:
                  updated = ensure_fx_import(path, updated)
                  path.write_text(updated, encoding='utf-8')
                  modified.append(normalized)

          print('Modified Dart files:')
          for path in modified:
              print(f'  {path}')

      - name: Remove temporary migration and audit workflows
        shell: bash
        run: |
          rm -f .github/workflows/ui-boundary-final-audit-temp.yml
          rm -f .github/workflows/ui-final-migrate-temp.yml

      - name: Check diff whitespace
        shell: bash
        run: git diff --check

      - name: Commit final migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git commit -m "refactor(ui): finish Material visual boundary migration"
          git push origin HEAD:fix/android-typography-fx-foundation

      - name: Report any unsupported visual leftovers
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('client/lib')
          patterns = {
              'showModalBottomSheet': re.compile(r'\bshowModalBottomSheet(?:<[^>]+>)?\s*\('),
              'showDialog': re.compile(r'\bshowDialog(?:<[^>]+>)?\s*\('),
              'AlertDialog': re.compile(r'\bAlertDialog\s*\('),
              'Dialog': re.compile(r'(?<!Fx)\bDialog\s*\('),
              'ListTile': re.compile(r'(?<!Fx)\bListTile\s*\('),
              'PopupMenuButton': re.compile(r'\bPopupMenuButton(?:<[^>]+>)?\s*\('),
              'PopupMenuItem': re.compile(r'\bPopupMenuItem(?:<[^>]+>)?\s*\('),
              'CheckedPopupMenuItem': re.compile(r'\bCheckedPopupMenuItem(?:<[^>]+>)?\s*\('),
              'PopupMenuDivider': re.compile(r'\bPopupMenuDivider\s*\('),
              'ExpansionTile': re.compile(r'\bExpansionTile\s*\('),
              'showTimePicker': re.compile(r'\bshowTimePicker\s*\('),
              'showDatePicker': re.compile(r'\bshowDatePicker\s*\('),
              'SimpleDialog': re.compile(r'\bSimpleDialog\s*\('),
              'SimpleDialogOption': re.compile(r'\bSimpleDialogOption\s*\('),
          }
          offenders = []
          for path in sorted(root.rglob('*.dart')):
              source = path.read_text(encoding='utf-8')
              hits = [name for name, pattern in patterns.items() if pattern.search(source)]
              if hits:
                  offenders.append(f"{path.as_posix()}: {', '.join(hits)}")
          print('=== FINAL VISUAL BOUNDARY RESIDUALS ===')
          if offenders:
              print('\n'.join(offenders))
              raise SystemExit(1)
          print('0')
