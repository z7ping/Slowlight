name: Sensitive Information Guard

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: secret-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-guard:
    name: Sensitive information guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check forbidden files and private environment traces
        run: python scripts/security/check_sensitive_files.py

      - name: Scan current tree with Gitleaks
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir --config .gitleaks.toml --redact --exit-code 1 --no-banner .
