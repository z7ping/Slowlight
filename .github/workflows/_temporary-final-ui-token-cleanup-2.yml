name: Temporary Final UI Token Cleanup 2
on:
  push:
    branches:
      - fix/android-typography-fx-foundation
    paths:
      - .github/workflows/_temporary-final-ui-token-cleanup-2.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-typography-fx-foundation
          fetch-depth: 0
      - name: Apply verified cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, subprocess
          workflow = Path('.github/workflows/_temporary-final-ui-token-cleanup.yml').read_text(encoding='utf-8')
          marker = "echo '"
          suffix = "' | base64 -d"
          if marker not in workflow or suffix not in workflow:
              raise SystemExit('cleanup payload markers not found')
          payload = workflow.split(marker, 1)[1].split(suffix, 1)[0]
          script = base64.b64decode(payload).decode('utf-8')
          old = "'AppTheme.textMd': ('SlowlightTypography.buttonSize', 7),"
          new = "'AppTheme.textMd': ('SlowlightTypography.buttonSize', 8),"
          if script.count(old) != 1:
              raise SystemExit('expected date-picker count marker not found exactly once')
          script = script.replace(old, new)
          Path('/tmp/cleanup.py').write_text(script, encoding='utf-8')
          subprocess.run(['python3', '/tmp/cleanup.py'], check=True)
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/lib
          git commit -m "refactor(ui): 清零业务与 Fx Token 残留"
          git push origin HEAD:fix/android-typography-fx-foundation
