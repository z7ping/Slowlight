name: Temporary Material Visual Zero Finalizer

on:
  push:
    branches:
      - fix/android-typography-fx-foundation

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-typography-fx-foundation
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Remove legacy Material button themes
        shell: python
        run: |
          from pathlib import Path
          p = Path('client/lib/ui/app_theme.dart')
          source = p.read_text(encoding='utf-8')

          blocks = [
              """      elevatedButtonTheme: ElevatedButtonThemeData(\n          style: ElevatedButton.styleFrom(\n              backgroundColor: p.primaryBtnBg,\n              foregroundColor: p.primaryBtnFg,\n              elevation: 0,\n              minimumSize: const Size(0, 44),\n              padding: const EdgeInsets.symmetric(horizontal: 14),\n              shape: RoundedRectangleBorder(\n                  borderRadius: BorderRadius.circular(8)))),\n""",
              """      elevatedButtonTheme: ElevatedButtonThemeData(\n          style: ElevatedButton.styleFrom(\n              backgroundColor: p.darkPrimaryBtnBg,\n              foregroundColor: p.darkPrimaryBtnFg,\n              elevation: 0,\n              minimumSize: const Size(0, 44),\n              padding: const EdgeInsets.symmetric(horizontal: 14),\n              shape: RoundedRectangleBorder(\n                  borderRadius: BorderRadius.circular(8)))),\n""",
          ]

          for index, old in enumerate(blocks, start=1):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f'expected exactly one legacy ElevatedButton theme block #{index}, got {count}'
                  )
              source = source.replace(old, '')

          p.write_text(source, encoding='utf-8')

      - name: Format
        run: dart format client/lib/ui/app_theme.dart client/lib/ui/widgets/fx_input.dart client/test/ui/ui_architecture_guard_test.dart

      - name: Resolve dependencies
        working-directory: client
        run: flutter pub get

      - name: Run static analysis
        working-directory: client
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run full-lib architecture guard
        working-directory: client
        run: flutter test test/ui/ui_architecture_guard_test.dart

      - name: Commit final zero-residue migration
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/lib/ui/app_theme.dart client/lib/ui/widgets/fx_input.dart client/test/ui/ui_architecture_guard_test.dart
          git commit -m 'refactor(ui): eliminate final Material visual residue'
          git push origin HEAD:fix/android-typography-fx-foundation
