name: Temporary Final UI Token Cleanup
on:
  push:
    branches:
      - fix/android-typography-fx-foundation
    paths:
      - .github/workflows/_temporary-final-ui-token-cleanup.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-typography-fx-foundation
          fetch-depth: 0
      - name: Apply cleanup
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/cleanup.py
          python3 /tmp/cleanup.py
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/lib
          git commit -m "refactor(ui): 清零业务与 Fx Token 残留"
          git push origin HEAD:fix/android-typography-fx-foundation
