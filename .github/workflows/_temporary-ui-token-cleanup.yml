name: Temporary UI Token Cleanup

on:
  push:
    branches:
      - fix/android-typography-fx-foundation
    paths:
      - .github/workflows/_temporary-ui-token-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-typography-fx-foundation
          fetch-depth: 0

      - name: Apply token-safe replacements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('client/lib/screens'), Path('client/lib/widgets')]
          files = [p for root in roots for p in root.rglob('*.dart')]

          alias_map = {
              'AppTheme.textXs': 'SlowlightTypography.captionSize',
              'AppTheme.textSm': 'SlowlightTypography.secondarySize',
              'AppTheme.textMd': 'SlowlightTypography.buttonSize',
              'AppTheme.textLg': 'SlowlightTypography.bodySize',
              'AppTheme.textXl': 'SlowlightTypography.sectionTitleSize',
              'AppTheme.text2Xl': 'SlowlightTypography.pageTitleSize',
              'AppTheme.text3Xl': 'SlowlightTypography.heroSize',
          }
          numeric_map = {
              '12': 'SlowlightTypography.captionSize',
              '14': 'SlowlightTypography.secondarySize',
              '15': 'SlowlightTypography.buttonSize',
              '16': 'SlowlightTypography.bodySize',
              '18': 'SlowlightTypography.sectionTitleSize',
              '20': 'SlowlightTypography.pageTitleSize',
              '24': 'SlowlightTypography.heroSize',
              '36': 'SlowlightTypography.displaySize',
          }

          changed = []
          for path in files:
              source = path.read_text(encoding='utf-8')
              original = source
              has_fx = 'ui/fx.dart' in source

              if has_fx:
                  for old, new in alias_map.items():
                      source = source.replace(old, new)

                  for number, token in numeric_map.items():
                      source = re.sub(
                          rf'(fontSize\s*:\s*){number}(?:\.0)?(?=\s*[,)*+/\-])',
                          rf'\1{token}',
                          source,
                      )

                  source = source.replace(
                      'const Color(0xFF4ADE80)',
                      'SlowlightSemanticColor.successEmphasis',
                  ).replace(
                      'Color(0xFF4ADE80)',
                      'SlowlightSemanticColor.successEmphasis',
                  ).replace(
                      'const Color(0xFF8B5CF6)',
                      'SlowlightSemanticColor.focus',
                  ).replace(
                      'Color(0xFF8B5CF6)',
                      'SlowlightSemanticColor.focus',
                  )

                  source = re.sub(
                      r'MediaQuery\.sizeOf\(context\)\.width\s*>=\s*1024(?:\.0)?',
                      'ResponsiveLayout.isDesktopOrWider(context)',
                      source,
                  )
                  source = re.sub(
                      r'MediaQuery\.sizeOf\(context\)\.width\s*<\s*1024(?:\.0)?',
                      '!ResponsiveLayout.isDesktopOrWider(context)',
                      source,
                  )
                  source = re.sub(
                      r'MediaQuery\.of\(context\)\.size\.width\s*>=\s*1024(?:\.0)?',
                      'ResponsiveLayout.isDesktopOrWider(context)',
                      source,
                  )
                  source = re.sub(
                      r'MediaQuery\.of\(context\)\.size\.width\s*<\s*1024(?:\.0)?',
                      '!ResponsiveLayout.isDesktopOrWider(context)',
                      source,
                  )

              if path.as_posix().endswith('widgets/dashboard/dashboard_body.dart'):
                  pattern = re.compile(
                      r'(?P<indent>\s*)final largeText\s*=\s*MediaQuery\.textScalerOf\(\s*context\s*\)'
                      r'\.scale\(SlowlightTypography\.secondarySize\)\s*>=\s*'
                      r'SlowlightTypography\.secondarySize\s*\*\s*1\.3\s*;\s*'
                      r'final columns\s*=\s*largeText\s*\?\s*1\s*:\s*2\s*;',
                      re.MULTILINE,
                  )
                  match = pattern.search(source)
                  if match is None:
                      raise SystemExit('Dashboard responsive block not found; refuse unsafe rewrite')
                  indent = match.group('indent')
                  replacement = (
                      f'{indent}// 四维卡片只根据当前组件真实宽度决定列数；\n'
                      f'{indent}// 字体放大通过内容自然增高处理，不在 130% 强制单列。\n'
                      f'{indent}final columns = constraints.maxWidth >= 320 ? 2 : 1;'
                  )
                  source = pattern.sub(replacement, source, count=1)

              if source != original:
                  path.write_text(source, encoding='utf-8')
                  changed.append(path.as_posix())

          print('Changed files:')
          print('\n'.join(changed) if changed else '(none)')
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet -- client/lib/screens client/lib/widgets; then
            echo "No cleanup changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/lib/screens client/lib/widgets
          git commit -m "refactor(ui): 全库收口语义字号与响应式断点"
          git push origin HEAD:fix/android-typography-fx-foundation
