name: Windows Smoke

# Temporarily manual-only to avoid noisy PR/push runs. Keep local checks and release gates.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-package:
    name: Build and package Windows
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: client
        run: flutter pub get
      - name: Verify lockfile is committed
        working-directory: client
        run: git diff --exit-code -- pubspec.lock
      - name: Build Windows debug
        working-directory: client
        run: flutter build windows --debug
      - name: Build Windows release
        working-directory: client
        run: flutter build windows --release
      - name: Verify Windows single instance
        shell: powershell
        run: |
          $exe = (Resolve-Path 'client\build\windows\x64\runner\Release\Slowlight.exe').Path
          $options = @{ FilePath = $exe; WorkingDirectory = (Split-Path $exe); PassThru = $true }

          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class SlowlightWindow {
            [DllImport("user32.dll")] public static extern bool ShowWindowAsync(IntPtr hwnd, int command);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr hwnd);
            [DllImport("user32.dll")] public static extern bool IsIconic(IntPtr hwnd);
          }
          '@

          function Wait-Until([scriptblock]$Condition, [string]$Failure) {
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            do {
              if (& $Condition) { return }
              Start-Sleep -Milliseconds 200
            } while ([DateTime]::UtcNow -lt $deadline)
            throw $Failure
          }

          function Assert-Relaunch([string]$Argument) {
            $duplicate = if ($Argument) {
              Start-Process @options -ArgumentList $Argument
            } else {
              Start-Process @options
            }
            if (-not $duplicate.WaitForExit(10000) -or $duplicate.ExitCode -ne 0) {
              throw "Duplicate launch did not exit successfully: $Argument"
            }
            $primary.Refresh()
            if ($primary.HasExited) { throw 'Relaunch closed the primary.' }
          }

          $launches = @()
          $restart = $null
          try {
            $launches = @(1..3 | ForEach-Object { Start-Process @options })
            Wait-Until {
              $running = @($launches | Where-Object { $_.Refresh(); -not $_.HasExited })
              $running.Count -eq 1 -and $running[0].MainWindowHandle -ne [IntPtr]::Zero
            } 'Concurrent cold launches did not settle on one visible window.'
            $primary = $launches | Where-Object { -not $_.HasExited }
            foreach ($duplicate in ($launches | Where-Object { $_.Id -ne $primary.Id })) {
              if ($duplicate.ExitCode -ne 0) { throw 'A cold duplicate returned an error.' }
            }
            $hwnd = $primary.MainWindowHandle

            # SW_MINIMIZE then a regular double-click launches the same executable.
            [void][SlowlightWindow]::ShowWindowAsync($hwnd, 6)
            Wait-Until { [SlowlightWindow]::IsIconic($hwnd) } 'Main window did not minimize.'
            Assert-Relaunch
            Wait-Until { -not [SlowlightWindow]::IsIconic($hwnd) } 'Main window was not restored.'

            # SW_HIDE simulates the window state after closing to tray.
            foreach ($argument in @('', 'slowlight://oauth-complete')) {
              [void][SlowlightWindow]::ShowWindowAsync($hwnd, 0)
              Wait-Until { -not [SlowlightWindow]::IsWindowVisible($hwnd) } 'Main window did not hide.'
              Assert-Relaunch $argument
              Wait-Until { [SlowlightWindow]::IsWindowVisible($hwnd) } 'Relaunch did not show the original window.'
            }

            # Simulate a process exit and verify the reservation can be reacquired.
            Stop-Process -Id $primary.Id
            if (-not $primary.WaitForExit(10000)) { throw 'The primary did not exit.' }
            $restart = Start-Process @options
            Wait-Until {
              $restart.Refresh()
              -not $restart.HasExited -and $restart.MainWindowHandle -ne [IntPtr]::Zero
            } 'Slowlight did not start again after the previous process exited.'
          } finally {
            foreach ($process in ($launches + @($restart) | Where-Object { $null -ne $_ })) {
              $process.Refresh()
              if (-not $process.HasExited) { Stop-Process -Id $process.Id -ErrorAction SilentlyContinue }
            }
            Get-Process -Name Slowlight -ErrorAction SilentlyContinue |
              Where-Object { $_.Path -eq $exe } |
              Stop-Process -ErrorAction SilentlyContinue
          }
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Prepare Simplified Chinese installer messages
        shell: powershell
        run: .\client\windows\installer\prepare_chinese_messages.ps1
      - name: Compile installer
        shell: powershell
        run: |
          $versionLine = Select-String -Path 'client\pubspec.yaml' -Pattern '^version:\s*(.+)$'
          $version = ($versionLine.Matches[0].Groups[1].Value -split '\+')[0]
          $env:SLOWLIGHT_WINDOWS_VERSION = $version

          Remove-Item 'dist\windows' -Recurse -Force -ErrorAction SilentlyContinue

          $iscc = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $iscc) {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($null -ne $command) {
              $iscc = Get-Item $command.Source
            }
          }
          if ($null -eq $iscc) {
            throw 'Inno Setup compiler ISCC.exe was not found.'
          }

          & $iscc.FullName 'client\windows\installer\slowlight.iss'
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

          $package = "dist\windows\Slowlight-v$version-windows-x64-setup.exe"
          if (-not (Test-Path $package)) {
            throw "Windows installer was not generated: $package"
          }
      - name: Upload smoke installer
        uses: actions/upload-artifact@v4
        with:
          name: slowlight-windows-smoke
          path: dist/windows/Slowlight-*-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 7
