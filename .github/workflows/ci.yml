name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  client-tests:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify lockfile is committed
        run: |
          if ! git diff --exit-code -- pubspec.lock; then
            echo "::error::client/pubspec.lock is stale. Run flutter pub get and commit the resolved lockfile."
            git diff -- pubspec.lock
            exit 1
          fi
      - name: Run static analysis
        run: flutter analyze
      - name: Run tests
        run: flutter test

  android-build:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify lockfile is committed
        run: git diff --exit-code -- pubspec.lock
      - name: Build Android debug APK
        run: flutter build apk --debug

  web-build:
    name: Web build (non-blocking for preview)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build web
        run: flutter build web --release

  server-tests:
    name: Go tests with PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: slowlight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d slowlight_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/slowlight_test?sslmode=disable
      JWT_SECRET: slowlight-ci-test-secret
      CONFIG_ENCRYPTION_KEY: slowlight-ci-config-encryption-key-32
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
          cache-dependency-path: server/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test ./...

  docs-check:
    name: Public docs checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate docs
        run: python scripts/docs/generate.py
      - name: Check public docs
        run: python scripts/docs/check.py
      - name: Verify generated files are committed
        run: git diff --exit-code
