name: Preview Packages for Release PR

# Temporarily manual-only to avoid noisy PR/push runs. Keep local checks and release gates.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    name: Build release PR packages
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'release/'))
    uses: ./.github/workflows/dogfood.yml
    secrets: inherit
