name: Temporary UI Boundary Audit

on:
  push:
    branches:
      - fix/android-typography-fx-foundation

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit semi-visual Material usage
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('client/lib')
          patterns = {
              'AppBar': r'\bAppBar\s*\(',
              'Card': r'(?<!Fx)\bCard\s*\(',
              'ListTile': r'(?<!Fx)\bListTile\s*\(',
              'AlertDialog': r'\bAlertDialog\s*\(',
              'Dialog': r'(?<!Fx)\bDialog\s*\(',
              'showModalBottomSheet': r'\bshowModalBottomSheet(?:<[^>]+>)?\s*\(',
              'BottomSheet': r'\bBottomSheet\s*\(',
              'SnackBar': r'\bSnackBar\s*\(',
              'ScaffoldMessenger': r'\bScaffoldMessenger\b',
              'Divider': r'(?<!Fx)\bDivider\s*\(',
              'VerticalDivider': r'\bVerticalDivider\s*\(',
              'InkWell': r'(?<!Fx)\bInkWell\s*\(',
              'Tooltip': r'(?<!Fx)\bTooltip\s*\(',
              'CircularProgressIndicator': r'\bCircularProgressIndicator\s*\(',
              'RefreshIndicator': r'\bRefreshIndicator\s*\(',
              'FloatingActionButton': r'\bFloatingActionButton(?:\.[A-Za-z]+)?\s*\(',
              'PopupMenuButton': r'\bPopupMenuButton(?:<[^>]+>)?\s*\(',
              'PopupMenuItem': r'\bPopupMenuItem(?:<[^>]+>)?\s*\(',
              'ExpansionTile': r'\bExpansionTile\s*\(',
              'Drawer': r'\bDrawer\s*\(',
              'NavigationDrawer': r'\bNavigationDrawer\s*\(',
              'BottomNavigationBar': r'\bBottomNavigationBar\s*\(',
              'NavigationBar': r'\bNavigationBar\s*\(',
              'TabBar': r'\bTabBar\s*\(',
              'Radio': r'\bRadio(?:<[^>]+>)?\s*\(',
              'RadioListTile': r'\bRadioListTile(?:<[^>]+>)?\s*\(',
              'MaterialBanner': r'\bMaterialBanner\s*\(',
              'MenuAnchor': r'\bMenuAnchor\s*\(',
              'MenuItemButton': r'\bMenuItemButton\s*\(',
          }

          hits = []
          totals = {name: 0 for name in patterns}
          for path in sorted(root.rglob('*.dart')):
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines()
              for name, raw in patterns.items():
                  rx = re.compile(raw)
                  for line_no, line in enumerate(lines, start=1):
                      matches = list(rx.finditer(line))
                      if matches:
                          count = len(matches)
                          totals[name] += count
                          hits.append((str(path), line_no, name, count, line.strip()))

          print('=== UI boundary audit summary ===')
          for name, count in totals.items():
              if count:
                  print(f'{name}: {count}')
          print('\n=== Exact hits ===')
          for path, line_no, name, count, line in hits:
              print(f'{path}:{line_no}: {name} x{count}: {line}')
          print(f'\nTOTAL HITS: {sum(totals.values())}')
