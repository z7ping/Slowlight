name: Temporary UI Boundary Audit

on:
  push:
    branches:
      - fix/android-typography-fx-foundation

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-typography-fx-foundation

      - name: Audit remaining semi-visual Material boundary
        shell: python
        run: |
          from pathlib import Path
          import re

          # Temporary branch-only audit; remove after reading the report.
          root = Path('client/lib')
          patterns = {
              'SnackBar': re.compile(r'\bSnackBar\s*\('),
              'ScaffoldMessenger': re.compile(r'\bScaffoldMessenger\b'),
              'showModalBottomSheet': re.compile(r'\bshowModalBottomSheet(?:<[^>]+>)?\s*\('),
              'BottomSheet': re.compile(r'\bBottomSheet\s*\('),
              'showDialog': re.compile(r'\bshowDialog(?:<[^>]+>)?\s*\('),
              'AlertDialog': re.compile(r'\bAlertDialog\s*\('),
              'Dialog': re.compile(r'(?<!Fx)\bDialog\s*\('),
              'ListTile': re.compile(r'(?<!Fx)\bListTile\s*\('),
              'PopupMenuButton': re.compile(r'\bPopupMenuButton(?:<[^>]+>)?\s*\('),
              'PopupMenuItem': re.compile(r'\bPopupMenuItem(?:<[^>]+>)?\s*\('),
              'AppBar': re.compile(r'\bAppBar\s*\('),
              'Drawer': re.compile(r'\bDrawer\s*\('),
              'ExpansionTile': re.compile(r'\bExpansionTile\s*\('),
          }
          totals = {name: 0 for name in patterns}
          hits = []

          for path in sorted(root.rglob('*.dart')):
              source = path.read_text(encoding='utf-8')
              lines = source.splitlines()
              for name, pattern in patterns.items():
                  for match in pattern.finditer(source):
                      totals[name] += 1
                      line_no = source.count('\n', 0, match.start()) + 1
                      text = lines[line_no - 1].strip() if line_no <= len(lines) else ''
                      hits.append((name, path.as_posix(), line_no, text))

          print('=== TOTALS ===')
          for name, count in totals.items():
              print(f'{name}: {count}')
          print('=== HITS ===')
          for name, path, line_no, text in hits:
              print(f'{name}\t{path}:{line_no}\t{text}')

          print('=== SNACKBAR CONTEXT ===')
          for path in sorted(root.rglob('*.dart')):
              lines = path.read_text(encoding='utf-8').splitlines()
              for index, line in enumerate(lines):
                  if not re.search(r'\bSnackBar\s*\(', line):
                      continue
                  start = max(0, index - 3)
                  end = min(len(lines), index + 9)
                  print(f'--- {path.as_posix()}:{index + 1} ---')
                  for pos in range(start, end):
                      print(f'{pos + 1:4}: {lines[pos]}')
