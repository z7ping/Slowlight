name: Temporary UI Layout Token Cleanup

on:
  push:
    branches:
      - fix/android-typography-fx-foundation
    paths:
      - .github/workflows/_temporary-ui-layout-token-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-typography-fx-foundation
          fetch-depth: 0

      - name: Replace legacy layout aliases
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roots = [Path('client/lib/screens'), Path('client/lib/widgets')]
          files = [p for root in roots for p in root.rglob('*.dart')]
          replacements = {
              'AppTheme.spaceXs': 'SlowlightSpacing.xs',
              'AppTheme.spaceSm': 'SlowlightSpacing.md',
              'AppTheme.spaceMd': 'SlowlightSpacing.xl',
              'AppTheme.spaceLg': 'SlowlightSpacing.xxxl',
              'AppTheme.spaceXl': 'SlowlightSpacing.page',
              'AppTheme.radiusSm': 'SlowlightRadius.sm',
              'AppTheme.radiusMd': 'SlowlightRadius.md',
              'AppTheme.radiusLg': 'SlowlightRadius.lg',
              'AppTheme.radiusXl': 'SlowlightRadius.xl',
          }

          changed = []
          skipped = []
          for path in files:
              source = path.read_text(encoding='utf-8')
              if not any(old in source for old in replacements):
                  continue
              if 'ui/fx.dart' not in source:
                  skipped.append(path.as_posix())
                  continue
              original = source
              for old, new in replacements.items():
                  source = source.replace(old, new)
              if source != original:
                  path.write_text(source, encoding='utf-8')
                  changed.append(path.as_posix())

          print('Changed files:')
          print('\n'.join(changed) if changed else '(none)')
          print('Skipped files without Fx import:')
          print('\n'.join(skipped) if skipped else '(none)')
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet -- client/lib/screens client/lib/widgets; then
            echo "No cleanup changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/lib/screens client/lib/widgets
          git commit -m "refactor(ui): 业务布局统一使用 Slowlight Token"
          git push origin HEAD:fix/android-typography-fx-foundation
