name: Temporary UI Layout Token Cleanup

on:
  push:
    branches:
      - fix/android-typography-fx-foundation
    paths:
      - .github/workflows/_temporary-ui-layout-token-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-typography-fx-foundation
          fetch-depth: 0

      - name: Replace Feishu part-file legacy layout aliases
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('client/lib/screens/feishu_screen_sections.dart')
          source = path.read_text(encoding='utf-8')
          original = source
          replacements = {
              'AppTheme.spaceXs': 'SlowlightSpacing.xs',
              'AppTheme.spaceSm': 'SlowlightSpacing.md',
              'AppTheme.spaceMd': 'SlowlightSpacing.xl',
              'AppTheme.spaceLg': 'SlowlightSpacing.xxxl',
              'AppTheme.spaceXl': 'SlowlightSpacing.page',
              'AppTheme.radiusSm': 'SlowlightRadius.sm',
              'AppTheme.radiusMd': 'SlowlightRadius.md',
              'AppTheme.radiusLg': 'SlowlightRadius.lg',
              'AppTheme.radiusXl': 'SlowlightRadius.xl',
              'borderRadius: 999': 'borderRadius: SlowlightRadius.pill',
          }
          for old, new in replacements.items():
              source = source.replace(old, new)
          if source == original:
              raise SystemExit('Expected Feishu layout aliases were not found; refuse empty rewrite')
          path.write_text(source, encoding='utf-8')
          print('Updated', path)
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/lib/screens/feishu_screen_sections.dart
          git commit -m "refactor(ui): 飞书界面统一使用 Slowlight 布局 Token"
          git push origin HEAD:fix/android-typography-fx-foundation
