name: Temporary Fx Notice Migration

on:
  push:
    branches:
      - fix/android-typography-fx-foundation

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-typography-fx-foundation
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Migrate Material notices to FxNotice
        run: python tools/ui_notice_migrate_temp.py

      - name: Format changed Dart files only
        shell: bash
        run: |
          mapfile -t files < .ui-notice-changed.txt
          dart format "${files[@]}"

      - name: Resolve dependencies
        working-directory: client
        run: flutter pub get

      - name: Run static analysis
        working-directory: client
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run architecture guard
        working-directory: client
        run: flutter test test/ui/ui_architecture_guard_test.dart

      - name: Commit notice migration
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/lib
          git commit -m 'refactor(ui): migrate global feedback to FxNotice'
          git push origin HEAD:fix/android-typography-fx-foundation
