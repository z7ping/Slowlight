name: Temporary Final UI Boundary Audit

on:
  push:
    branches:
      - fix/android-typography-fx-foundation

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-typography-fx-foundation

      - name: Print remaining UI boundary contexts
        shell: python
        run: |
          from pathlib import Path
          import re

          # Temporary branch-only audit; remove after this report.
          root = Path('client/lib')
          patterns = {
              'showModalBottomSheet': re.compile(r'\bshowModalBottomSheet(?:<[^>]+>)?\s*\('),
              'showDialog': re.compile(r'\bshowDialog(?:<[^>]+>)?\s*\('),
              'Dialog': re.compile(r'(?<!Fx)\bDialog\s*\('),
              'ListTile': re.compile(r'(?<!Fx)\bListTile\s*\('),
              'PopupMenuButton': re.compile(r'\bPopupMenuButton(?:<[^>]+>)?\s*\('),
              'PopupMenuItem': re.compile(r'\bPopupMenuItem(?:<[^>]+>)?\s*\('),
              'ExpansionTile': re.compile(r'\bExpansionTile\s*\('),
              'AppBar': re.compile(r'\bAppBar\s*\('),
              'Drawer': re.compile(r'\bDrawer\s*\('),
          }
          totals = {name: 0 for name in patterns}
          for path in sorted(root.rglob('*.dart')):
              source = path.read_text(encoding='utf-8')
              lines = source.splitlines()
              for name, pattern in patterns.items():
                  for match in pattern.finditer(source):
                      totals[name] += 1
                      line = source.count('\n', 0, match.start()) + 1
                      print(f'=== {name} {path.as_posix()}:{line} ===')
                      start = max(0, line - 7)
                      end = min(len(lines), line + 18)
                      for idx in range(start, end):
                          print(f'{idx + 1:4}: {lines[idx]}')
          print('=== TOTALS ===')
          for name, count in totals.items():
              print(f'{name}: {count}')
