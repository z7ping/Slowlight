name: Temporary Fx Finalizer

on:
  push:
    branches:
      - fix/android-typography-fx-foundation

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-typography-fx-foundation
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Apply exact Fx replacements
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              source = p.read_text(encoding='utf-8')
              count = source.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} exact matches, got {count}')
              p.write_text(source.replace(old, new), encoding='utf-8')

          # Dashboard: two section-header actions.
          replace_exact(
              'client/lib/widgets/dashboard/dashboard_body.dart',
              """                : TextButton(\n                    onPressed: widget.onViewAllTasks,\n                    child: const Text('查看全部'),\n                  ),""",
              """                : FxButton(\n                    label: '查看全部',\n                    variant: FxButtonVariant.ghost,\n                    size: FxButtonSize.sm,\n                    onPressed: widget.onViewAllTasks,\n                  ),""",
          )
          replace_exact(
              'client/lib/widgets/dashboard/dashboard_body.dart',
              """                : TextButton(\n                    onPressed: widget.onViewAllHabits,\n                    child: const Text('查看全部'),\n                  ),""",
              """                : FxButton(\n                    label: '查看全部',\n                    variant: FxButtonVariant.ghost,\n                    size: FxButtonSize.sm,\n                    onPressed: widget.onViewAllHabits,\n                  ),""",
          )

          # Home task detail: close action and weekday chips.
          replace_exact(
              'client/lib/screens/home_task_detail_panel.dart',
              """                IconButton(\n                  icon: const Icon(Icons.close, size: 20),\n                  onPressed: widget.onClose,\n                  tooltip: '关闭',\n                  splashRadius: 18,\n                ),""",
              """                FxIconButton(\n                  icon: Icons.close,\n                  iconSize: 20,\n                  onPressed: widget.onClose,\n                  tooltip: '关闭',\n                ),""",
          )
          replace_exact(
              'client/lib/screens/home_task_detail_panel.dart',
              """          return ChoiceChip(\n            label: Text(entry.value),\n            selected: selected,\n            selectedColor: AppTheme.primaryLight,\n            onSelected: (_) {\n              setState(() {\n                if (selected) {\n                  _selectedWeekdays.remove(day);\n                } else {\n                  _selectedWeekdays.add(day);\n                }\n              });\n            },\n          );""",
              """          return FxChip(\n            label: entry.value,\n            backgroundColor:\n                selected ? AppTheme.primaryLight : fxSubtleSurface(context),\n            foregroundColor: selected\n                ? activePalette.accent\n                : Theme.of(context).colorScheme.onSurfaceVariant,\n            borderColor:\n                selected ? activePalette.accent : fxBorder(context),\n            borderRadius: 999,\n            onTap: () {\n              setState(() {\n                if (selected) {\n                  _selectedWeekdays.remove(day);\n                } else {\n                  _selectedWeekdays.add(day);\n                }\n              });\n            },\n          );""",
          )

          # Mobile shell: app bar actions.
          replace_exact(
              'client/lib/screens/focus_home_screen.dart',
              """        leading: _navigation.isTool\n            ? IconButton(\n                icon: const Icon(LucideIcons.chevronLeft, size: 20),\n                tooltip: '返回',\n                onPressed: _closeTool,\n              )\n            : IconButton(\n                icon: const Icon(LucideIcons.menu, size: 20),\n                tooltip: '工具',\n                onPressed: _openMobileTools,\n              ),""",
              """        leading: _navigation.isTool\n            ? FxIconButton(\n                icon: LucideIcons.chevronLeft,\n                iconSize: 20,\n                tooltip: '返回',\n                onPressed: _closeTool,\n              )\n            : FxIconButton(\n                icon: LucideIcons.menu,\n                iconSize: 20,\n                tooltip: '工具',\n                onPressed: _openMobileTools,\n              ),""",
          )
          replace_exact(
              'client/lib/screens/focus_home_screen.dart',
              """            SizedBox(\n              width: 44,\n              height: 44,\n              child: IconButton(\n                icon: const Icon(LucideIcons.pencil, size: 18),\n                tooltip: '写下观察',\n                onPressed: _writeObservation,\n              ),\n            ),\n            SizedBox(\n              width: 44,\n              height: 44,\n              child: IconButton(\n                icon: const Icon(LucideIcons.plus, size: 20),\n                tooltip: '记录任务',\n                onPressed: _quickAdd,\n              ),\n            ),""",
              """            FxIconButton(\n              icon: LucideIcons.pencil,\n              iconSize: 18,\n              tooltip: '写下观察',\n              onPressed: _writeObservation,\n            ),\n            FxIconButton(\n              icon: LucideIcons.plus,\n              iconSize: 20,\n              tooltip: '记录任务',\n              onPressed: _quickAdd,\n            ),""",
          )

          # Mobile drawer: close and About actions.
          replace_exact(
              'client/lib/screens/focus_home_screen.dart',
              """                  if (closeDrawer)\n                    SizedBox(\n                      width: 44,\n                      height: 44,\n                      child: IconButton(\n                        tooltip: '关闭',\n                        icon: const Icon(LucideIcons.x, size: 20),\n                        onPressed: () => Navigator.pop(context),\n                      ),\n                    ),""",
              """                  if (closeDrawer)\n                    FxIconButton(\n                      icon: LucideIcons.x,\n                      iconSize: 20,\n                      tooltip: '关闭',\n                      onPressed: () => Navigator.pop(context),\n                    ),""",
          )
          replace_exact(
              'client/lib/screens/focus_home_screen.dart',
              """                    SizedBox(\n                      width: 44,\n                      height: 44,\n                      child: IconButton(\n                        tooltip: '关于',\n                        icon: const Icon(LucideIcons.circleHelp, size: 18),\n                        onPressed: () => openPage(const AboutScreen()),\n                      ),\n                    ),""",
              """                    FxIconButton(\n                      icon: LucideIcons.circleHelp,\n                      iconSize: 18,\n                      tooltip: '关于',\n                      onPressed: () => openPage(const AboutScreen()),\n                    ),""",
          )

      - name: Format targeted files
        run: >-
          dart format
          client/lib/widgets/dashboard/dashboard_body.dart
          client/lib/screens/home_task_detail_panel.dart
          client/lib/screens/focus_home_screen.dart

      - name: Resolve dependencies
        working-directory: client
        run: flutter pub get

      - name: Run static analysis
        working-directory: client
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run architecture guard
        working-directory: client
        run: flutter test test/ui/ui_architecture_guard_test.dart

      - name: Commit finalized Fx migration
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/lib/widgets/dashboard/dashboard_body.dart \
                  client/lib/screens/home_task_detail_panel.dart \
                  client/lib/screens/focus_home_screen.dart
          git commit -m 'refactor(ui): finish remaining Fx visual controls'
          git push origin HEAD:fix/android-typography-fx-foundation
