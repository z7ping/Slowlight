name: slowlight
description: Slowlight Flutter 客户端

publish_to: 'none'

version: 0.2.0-alpha.1+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.1.0
  provider: ^6.1.1
  flutter_local_notifications: ^17.2.1
  local_notifier: ^0.1.5
  timezone: ^0.9.2
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.4
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.8.3
  table_calendar: ^3.1.2
  window_manager: ^0.3.9
  # Windows 多屏休息提醒仍使用多窗口能力；托盘本身不创建额外快速面板。
  desktop_multi_window:
    path: third_party/desktop_multi_window
  launch_at_startup: ^0.3.1
  system_tray: ^2.0.3
  shadcn_ui: ^0.26.2
  lucide_icons_flutter: ^3.0.0
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

hooks:
  user_defines:
    sqlite3:
      source: system

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.ico
    - assets/tray_icon_macos.png
    - assets/tray_icon_linux.png
    - assets/slowlight_logo.png
